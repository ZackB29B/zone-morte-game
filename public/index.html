<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zone Morte - Jeu Complet</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid #333;
      background: #1e1e1e;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let bullets = [];
    let grenades = [];
    let parts = [];
    let ents = [];
    let MAP = 2000;
    let G = { over: false, endT: 0, state: 'play', hurt: 0 };
    let ONLINE = false;
    let NET = { cd: 0 };
    let zone = { cx: 1000, cy: 1000, r: 800 };
    let Z = { p: 0 };
    let ZDMG = [5, 10, 20];
    let WP = [
      { name: 'Pistolet', spd: 800, rng: 600, rate: 0.3, mag: 12, dmg: 15, pel: 1, spread: 0.05, rel: 1.5 }
    ];

    // Joueur principal
    let player = {
      x: 1000, y: 1000, r: 16, a: 0, hp: 100, maxHp: 100, alive: true,
      grenades: { grenade: 2, incend: 2, flash: 2, smoke: 2 },
      curGrenade: 'grenade'
    };
    ents.push(player);

    function rnd(min, max) { return Math.random() * (max - min) + min; }
    function inObs(x, y, r, lv) { return false; }
    function hitObs(x, y, lv) { return null; }
    function breakDoor(ho, own) {}
    function hurt(e, dmg, own) { e.hp -= dmg; }

    // Rotation des grenades (incluant la Grenade Incendiaire au bon endroit)
    function cycleGrenade(p) {
      const order = ['grenade', 'incend', 'flash', 'smoke'];
      const available = order.filter(g => (p.grenades[g] || 0) > 0);
      if (available.length === 0) {
        p.curGrenade = 'grenade';
        p.grenades['grenade'] = 5;
        return;
      }
      let idx = available.indexOf(p.curGrenade) + 1;
      if (idx >= available.length) idx = 0;
      p.curGrenade = available[idx];
      
      const names = { 
        grenade: 'Grenade Létale', 
        incend: 'Grenade Incendiaire', 
        flash: 'Grenade Flash', 
        smoke: 'Grenade Fumigène' 
      };
      console.log('Grenade active : ' + (names[p.curGrenade] || p.curGrenade));
    }

    // Lancer de grenade via le Clic Droit
    function throwGrenade(p) {
      if (!p.alive) return;
      if (!p.grenades) p.grenades = { grenade: 1, incend: 1, flash: 1, smoke: 1 };
      if (!p.curGrenade) p.curGrenade = 'grenade';

      if ((p.grenades[p.curGrenade] || 0) <= 0) {
        cycleGrenade(p);
      }
      if ((p.grenades[p.curGrenade] || 0) > 0) {
        p.grenades[p.curGrenade]--;
        grenades.push({
          x: p.x, y: p.y,
          vx: Math.cos(p.a) * 400,
          vy: Math.sin(p.a) * 400,
          life: 1.5,
          type: p.curGrenade,
          own: p
        });
      }
    }

    // Contrôles clavier (Touche G) et souris (Clic droit)
    window.addEventListener('keydown', e => {
      if (e.code === 'KeyG') cycleGrenade(player);
    });

    canvas.addEventListener('contextmenu', e => {
      e.preventDefault();
      throwGrenade(player);
    });

    // Boucle de mise à jour sécurisée des balles, grenades et entités
    function update(dt) {
      if (isNaN(dt) || dt <= 0) return;

      // Mise à jour sécurisée des projectiles (balles)
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b) { bullets.splice(i, 1); continue; }
        if (isNaN(b.vx) || isNaN(b.vy) || isNaN(b.x) || isNaN(b.y)) {
          bullets.splice(i, 1);
          continue;
        }
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.x < 0 || b.y < 0 || b.x > MAP || b.y > MAP || b.life <= 0) {
          bullets.splice(i, 1);
        }
      }

      // Mise à jour des grenades
      for (let i = grenades.length - 1; i >= 0; i--) {
        const g = grenades[i];
        if (!g) { grenades.splice(i, 1); continue; }
        g.x += g.vx * dt;
        g.y += g.vy * dt;
        g.vx *= 0.92;
        g.vy *= 0.92;
        g.life -= dt;
        if (g.life <= 0) {
          grenades.splice(i, 1);
        }
      }
    }

    function gameLoop() {
      let dt = 0.016;
      update(dt);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Affichage des balles
      ctx.fillStyle = '#ffcc00';
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x - player.x + 400, b.y - player.y + 300, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Affichage des grenades
      ctx.fillStyle = '#ff5533';
      for (const g of grenades) {
        ctx.beginPath();
        ctx.arc(g.x - player.x + 400, g.y - player.y + 300, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Affichage du joueur
      ctx.fillStyle = '#4cd137';
      ctx.beginPath();
      ctx.arc(400, 300, player.r, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
