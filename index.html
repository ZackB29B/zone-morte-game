<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zone Morte - Jeu Corrigé</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid #333;
      background: #1e1e1e;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    // Version corrigée et sécurisée du jeu Zone Morte
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let bullets = [];
    let parts = [];
    let ents = [];
    let MAP = 2000;
    let G = { over: false, endT: 0, state: 'play', hurt: 0 };
    let ONLINE = false;
    let NET = { cd: 0 };
    let zone = { cx: 1000, cy: 1000, r: 800 };
    let Z = { p: 0 };
    let ZDMG = [5, 10, 20];
    let WP = [
      { name: 'Pistolet', spd: 800, rng: 600, rate: 0.3, mag: 12, dmg: 15, pel: 1, spread: 0.05, rel: 1.5 }
    ];

    function rnd(min, max) { return Math.random() * (max - min) + min; }
    function inObs(x, y, r, lv) { return false; }
    function hitObs(x, y, lv) { return null; }
    function breakDoor(ho, own) {}
    function hurt(e, dmg, own) { e.hp -= dmg; }
    function showOver() {}

    // Boucle de mise à jour sécurisée des balles
    function updateBullets(dt) {
      if (isNaN(dt) || dt <= 0) return;
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b) { bullets.splice(i, 1); continue; }
        if (isNaN(b.vx) || isNaN(b.vy) || isNaN(b.x) || isNaN(b.y)) {
          bullets.splice(i, 1);
          continue;
        }
        
        // Avancée sécurisée de la balle
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;

        let dead = false;

        if (b.x < 0 || b.y < 0 || b.x > MAP || b.y > MAP || b.life <= 0) {
          dead = true;
        } else {
          const ho = hitObs(b.x, b.y, b.lv);
          if (ho) {
            if (ho.door && !ho.open && !b.vis) {
              ho.hp -= (b.dmg || 15);
              if (ho.hp <= 0) breakDoor(ho, b.own);
            }
            dead = true;
          }
        }

        if (dead) {
          bullets.splice(i, 1);
        }
      }
    }

    function gameLoop() {
      let dt = 0.016;
      updateBullets(dt);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#ffcc00';
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x - 400, b.y - 300, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
